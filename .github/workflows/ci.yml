name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on all PR commits
        run: |
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git rev-list "$base".."$head"); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $sha is missing a Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing

  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    # Postgres 16, matching the version SERVER-OPS.md documents the actual
    # deploy running (medusa-postgres-1, postgres:16-alpine). On a plain
    # ubuntu-latest runner (not a containerized job) this service's port is
    # published straight to the runner's own localhost -- no docker networking
    # to wire up, DB_HOST=localhost below just works.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Only the DB-backed suites (currently: invoicing-abraflexi's
      # idempotency-guard test) actually run here. The Comgate/Packeta/Abra
      # Flexi *sandbox* suites under the same `test:integration` script stay
      # skipped -- they gate on real external API credentials
      # (COMGATE_MERCHANT, PACKETA_API_KEY, ABRA_FLEXI_*) that are
      # deliberately not CI secrets: this is a public repo, and those suites
      # exist to be run by hand against a developer's own sandbox account.
      - run: pnpm test:integration
        env:
          DB_HOST: localhost
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_PORT: "5432"
